  - {id: yum-infra-legacy-compat, type: yum, path: "yum/infra/{arch}", os: {family: cross-el, major: 0, lifecycle: frozen}, arches: [aarch64, x86_64], default_pool: public, active: false, publish_targets: [cf, cos], yum: {compression: gzip, package_keyring: keys/migration-unverified-package-signers.asc, noarch_mode: replicate, compatibility_carrier: true}}
