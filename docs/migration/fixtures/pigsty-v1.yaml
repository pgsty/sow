  # Asset source paths are canonicalized before publication. Target-specific
  # .io/.cc root bodies are never represented as equivalent bytes. The
  # reviewed external builder pins all eight source bodies and emits four
  # deterministic mirror-aware canonical scripts; the shared owner is active
  # after its digest-bound local CLI handoff. The bin inventory carrier lets M0
  # bind the untouched legacy bytes without making them selectable or
  # publishable. The Pro owner
  # is active after exact-copy gated adoption: its zero-byte legacy checksums
  # file is excluded and replaced through an ordinary gated `sow add` using the
  # reviewed deterministic checksum fixture.
  - {id: asset-root-both, type: asset, path: assets/root-both, default_pool: public, publish_targets: [cf, cos], asset: {kind: bootstrap, mutable_paths: [beta, get, pig, pkg], public_path: ".", root_keys: [beta, get, pig, pkg]}}
  - {id: asset-root-cos, type: asset, path: assets/root-cos, default_pool: public, publish_targets: [cos], asset: {kind: bootstrap, mutable_paths: [cc, claude, ray], public_path: ".", root_keys: [cc, claude, ray]}}
  - {id: asset-legacy-bin-inventory, type: asset, path: bin, active: false, exclude: [fileauth.txt], default_pool: public, asset: {kind: inventory, public_path: migration/bin, inventory_carrier: true}}
  - {id: asset-dba, type: asset, path: dba, default_pool: public, publish_targets: [cf, cos], asset: {kind: generic, public_path: dba}}
  - {id: asset-etc, type: asset, path: etc, default_pool: public, publish_targets: [cf, cos], asset: {kind: config, public_path: etc}}
  - {id: asset-ext, type: asset, path: ext, default_pool: public, publish_targets: [cf, cos], asset: {kind: release, public_path: ext}}
  - {id: asset-img, type: asset, path: img, default_pool: public, publish_targets: [cos], asset: {kind: image, public_path: img}}
  - {id: asset-pkg-claude, type: asset, path: pkg/claude, default_pool: public, publish_targets: [cos], asset: {kind: release, public_path: pkg/claude}}
  - {id: asset-pkg-pig, type: asset, path: pkg/pig, default_pool: public, publish_targets: [cf, cos], asset: {kind: release, mutable_paths: [latest], public_path: pkg/pig}}
  - {id: asset-pkg-ray, type: asset, path: pkg/ray, default_pool: public, publish_targets: [cos], asset: {kind: release, public_path: pkg/ray}}
  - {id: asset-src, type: asset, path: src, default_pool: public, publish_targets: [cf, cos], asset: {kind: source, public_path: src}}
  - {id: asset-pro-gated, type: asset, path: pro, exclude: [checksums], default_pool: gated, publish_targets: [cf, cos], asset: {kind: offline, public_path: gated/pro}}

# Groups contain only operable, non-quarantined physical repos. In particular,
# yum-infra-legacy-compat is intentionally absent from every group.
