# Complete, non-secret, local-only Pigsty-v1 physical migration contract.
#
# This fixture is bound to legacy-physical-topology.tsv by
# TestPigstyV1PhysicalMigrationContract. It declares no cloud endpoint,
# credential, entitlement, private key, or verified signer claim. The public
# key paths are deliberately named "unverified": an operator must replace them
# with reviewed public-only bundles before adoption/materialization.
#
# yum/infra/{arch} is an inactive inventory carrier only. Its cross-EL legacy
# projection is not frozen, it is absent from every repo_group, and the machine
# ledger requires quarantine-compat until a later ADR supplies the real ref and
# consumer contract. The nested PGDG rhel-10.0-aarch64 child is not a repo at
# all; the parent excludes it and the ledger quarantines it fail closed.
schema: sow/v1

state:
  snapshot_materialization_months: 6
  apt_by_hash_retention: 2
  yum_generation_retention: 2
  cas_history_commits: 32

gpg: {public_key: keys/migration-unverified-repository-key.asc}
pools: {public: {}, gated: {}}

repos:
  # APT: 11 physical archives expand to exactly 74 Packages indices.
  # stash is an external-builder handoff, not a served repository pool. The two
  # rustfs a94 bodies are unreferenced reprepro orphans; b8 is the indexed
  # version. Preserve all 22 source bytes in place but quarantine them from the
  # canonical APT owner instead of guessing membership.
  - {id: apt-infra, type: apt, path: apt/infra, os: {family: generic, major: 1, suite: generic, lifecycle: frozen}, arches: [amd64, arm64], default_pool: public, exclude: [stash/**, pool/main/r/rustfs/rustfs_1.0.0-a94_*.deb], publish_targets: [cf, cos], apt: {suites: [generic], components: [main], suite_components: {generic: [main]}, suite_lifecycle: {generic: frozen}}}
  - {id: apt-mssql, type: apt, path: apt/mssql, os: {family: mixed, major: 1, lifecycle: active}, arches: [amd64, arm64], default_pool: public, publish_targets: [cf, cos], apt: {suites: [focal, jammy, noble], components: [main], suite_components: {focal: [main], jammy: [main], noble: [main]}, suite_lifecycle: {focal: frozen, jammy: active, noble: active}}}
  - {id: apt-percona, type: apt, path: apt/percona, os: {family: mixed, major: 1, lifecycle: active}, arches: [amd64, arm64], default_pool: public, publish_targets: [cf, cos], apt: {suites: [bookworm, bullseye, jammy, noble, resolute, trixie], components: [main], suite_components: {bookworm: [main], bullseye: [main], jammy: [main], noble: [main], resolute: [main], trixie: [main]}, suite_lifecycle: {bookworm: active, bullseye: frozen, jammy: active, noble: active, resolute: active, trixie: active}}}
  - id: apt-pgdg
    type: apt
    path: apt/pgdg
    os: {family: mixed, major: 1, lifecycle: active}
    arches: [amd64, arm64]
    default_pool: public
    publish_targets: [cf, cos]
    apt:
      suites: [bookworm-pgdg, bookworm-pgdg-testing, bullseye-pgdg, bullseye-pgdg-testing, jammy-pgdg, jammy-pgdg-testing, noble-pgdg, noble-pgdg-testing, trixie-pgdg, trixie-pgdg-testing]
      components: [main, "18", "19"]
      suite_components:
        bookworm-pgdg: [main]
        bookworm-pgdg-testing: [main, "18", "19"]
        bullseye-pgdg: [main]
        bullseye-pgdg-testing: [main, "18", "19"]
        jammy-pgdg: [main]
        jammy-pgdg-testing: [main, "18", "19"]
        noble-pgdg: [main]
        noble-pgdg-testing: [main, "18", "19"]
        trixie-pgdg: [main]
        trixie-pgdg-testing: [main, "18", "19"]
      suite_lifecycle:
        bookworm-pgdg: active
        bookworm-pgdg-testing: active
        bullseye-pgdg: frozen
        bullseye-pgdg-testing: frozen
        jammy-pgdg: active
        jammy-pgdg-testing: active
        noble-pgdg: active
        noble-pgdg-testing: active
        trixie-pgdg: active
        trixie-pgdg-testing: active
  - {id: apt-pgsql-focal, type: apt, path: apt/pgsql/focal, os: {family: ubuntu, major: 20, suite: focal, lifecycle: frozen}, arches: [amd64, arm64], default_pool: public, publish_targets: [cf, cos], apt: {suites: [focal], components: [main], suite_components: {focal: [main]}, suite_lifecycle: {focal: frozen}}}
  - {id: apt-pgsql-jammy, type: apt, path: apt/pgsql/jammy, os: {family: ubuntu, major: 22, suite: jammy, lifecycle: active}, arches: [amd64, arm64], default_pool: public, publish_targets: [cf, cos], apt: {suites: [jammy], components: [main], suite_components: {jammy: [main]}, suite_lifecycle: {jammy: active}}}
  - {id: apt-pgsql-noble, type: apt, path: apt/pgsql/noble, os: {family: ubuntu, major: 24, suite: noble, lifecycle: active}, arches: [amd64, arm64], default_pool: public, publish_targets: [cf, cos], apt: {suites: [noble], components: [main], suite_components: {noble: [main]}, suite_lifecycle: {noble: active}}}
  - {id: apt-pgsql-resolute, type: apt, path: apt/pgsql/resolute, os: {family: ubuntu, major: 26, suite: resolute, lifecycle: active}, arches: [amd64, arm64], default_pool: public, publish_targets: [cf, cos], apt: {suites: [resolute], components: [main], suite_components: {resolute: [main]}, suite_lifecycle: {resolute: active}}}
  - {id: apt-pgsql-bullseye, type: apt, path: apt/pgsql/bullseye, os: {family: debian, major: 11, suite: bullseye, lifecycle: frozen}, arches: [amd64, arm64], default_pool: public, publish_targets: [cf, cos], apt: {suites: [bullseye], components: [main], suite_components: {bullseye: [main]}, suite_lifecycle: {bullseye: frozen}}}
  - {id: apt-pgsql-bookworm, type: apt, path: apt/pgsql/bookworm, os: {family: debian, major: 12, suite: bookworm, lifecycle: active}, arches: [amd64, arm64], default_pool: public, publish_targets: [cf, cos], apt: {suites: [bookworm], components: [main], suite_components: {bookworm: [main]}, suite_lifecycle: {bookworm: active}}}
  - {id: apt-pgsql-trixie, type: apt, path: apt/pgsql/trixie, os: {family: debian, major: 13, suite: trixie, lifecycle: active}, arches: [amd64, arm64], default_pool: public, publish_targets: [cf, cos], apt: {suites: [trixie], components: [main], suite_components: {trixie: [main]}, suite_lifecycle: {trixie: active}}}

  # YUM: 74 path templates expand to 130 ordinary legacy repodata leaves.
  # Every metadata signer remains not-claimed and every RPM signer remains
  # unverified in the adjacent ledger; these paths are trust inputs, not proof.
  - {id: yum-gpsql-el7, type: yum, path: "yum/gpsql/el7.{arch}", os: {family: el, major: 7, lifecycle: frozen}, arches: [x86_64], default_pool: public, publish_targets: [cf, cos], yum: {compression: gzip, package_keyring: keys/migration-unverified-package-signers.asc, noarch_mode: replicate}}
  - {id: yum-gpsql-el8, type: yum, path: "yum/gpsql/el8.{arch}", os: {family: el, major: 8, lifecycle: frozen}, arches: [x86_64], default_pool: public, publish_targets: [cf, cos], yum: {compression: gzip, package_keyring: keys/migration-unverified-package-signers.asc, noarch_mode: replicate}}
