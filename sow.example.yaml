schema: sow/v3
architectures:
  - x86_64
  - aarch64

repos:
  pgsql:
    # Optional signing: uncomment only the entries you use and replace key references.
    # signing:
    #   rpm:
    #     packages:
    #       mode: fill
    #       key: agent://REPLACE_WITH_YOUR_FINGERPRINT
    #       passfile: /run/secrets/rpm-password
    #     metadata:
    #       key: file:///srv/sow-secrets/repo-signing.asc
    #       passfile: /run/secrets/metadata-password
    #   deb:
    #     metadata:
    #       key: file:///srv/sow-secrets/repo-signing.asc
    #       passfile: /run/secrets/metadata-password
    # Passfile support requires SOW 0.7 or later. Priority: --passfile > per-key
    # passfile (or legacy metadata passphrase) > SOW_GPG_PASSFILE.
    # Config-relative paths start at the workspace root; no default file is searched.
    # The file is one nonempty UTF-8 line (<= 64 KiB including an optional LF/CRLF).
    # Only that final newline is removed; spaces/tabs are literal. Use a regular
    # file without symlinks, outside the repository, normally mode 0600.
    # Full format and compatibility: https://sow.pgsty.com/docs/reference/config/#passfile
    dists:
      el9:
        format: rpm
        exclude:
          - kind: [debuginfo, debugsource]
      noble:
        format: deb

# Publication targets are optional. Add a validated filesystem or R2 target
# only when this workspace is ready to publish.
targets: {}
