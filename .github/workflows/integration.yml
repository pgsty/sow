name: Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-clients:
    name: Repository End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Pull client images
        run: |
          docker pull ubuntu:22.04
          docker pull almalinux:10
          docker pull almalinux:9
          docker pull almalinux:8

      - name: Run current CLI and repository-client integration tests
        env:
          SOW_RUN_DOCKER_COMPAT: "1"
          SOW_COMPAT_APT_IMAGE: ubuntu:22.04
          SOW_COMPAT_DNF_IMAGE: almalinux:10
          SOW_COMPAT_EL9_IMAGE: almalinux:9
          SOW_COMPAT_EL8_IMAGE: almalinux:8
        run: >-
          go test -timeout 20m -count=1 -v ./qa/compat
          -run '^(TestShippedExampleSupportsCleanRoomLocalMVP|TestV2APTClientCompatibility|TestYUMDetachedSignatureBridgeCompatibility)$'

  s3-compatible:
    name: S3-Compatible Publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Pull pinned Silo fixture
        run: docker pull pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46

      - name: Run R2 transport integration test
        env:
          SOW_SILO_TEST: "1"
        run: go test -timeout 10m -count=1 -v ./internal/r2 -run '^TestSiloS3Compatibility$'
