name: Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-clients:
    name: Repository End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Pull client images
        run: |
          docker pull ubuntu:22.04
          docker pull almalinux:10
          docker pull almalinux:9
          docker pull almalinux:8

      - name: Run current CLI and repository-client integration tests
        env:
          SOW_RUN_DOCKER_COMPAT: "1"
          SOW_COMPAT_APT_IMAGE: ubuntu:22.04
          SOW_COMPAT_DNF_IMAGE: almalinux:10
          SOW_COMPAT_EL9_IMAGE: almalinux:9
          SOW_COMPAT_EL8_IMAGE: almalinux:8
        run: >-
          go test -timeout 20m -count=1 -v ./test/compat
          -run '^(TestShippedExampleSupportsCleanRoomLocalMVP|TestV2APTClientCompatibility|TestYUMDetachedSignatureBridgeCompatibility)$'

  s3-compatible:
    name: S3-Compatible Publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Pull pinned MinIO fixture
        run: docker pull minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e

      - name: Run R2 transport integration test
        env:
          SOW_MINIO_TEST: "1"
        run: go test -timeout 10m -count=1 -v ./internal/r2 -run '^TestMinIOS3Compatibility$'
