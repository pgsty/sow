name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Normal CI must remain local and secret-free. Networked client and S3 tests
# live in integration.yml; production cloud tests require explicit local
# authority and are never enabled by repository secrets.
env:
  SOW_RUN_REAL_CLOUD: "0"
  SOW_RUN_REAL_EDGE_EVIDENCE: "0"
  SOW_RUN_REAL_UPSTREAM: "0"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  quality:
    name: Format, Vet, Staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting and module files
        run: make fmt-check tidy-check

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  test:
    name: Unit and Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test Go packages
        run: go test -timeout 45m -count=1 ./...

      - name: Test patched RPM parser module
        run: (cd third_party/cavaliergopher-rpm && go test -count=1 ./...)

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test edge contracts
        working-directory: edge
        run: npm test

  package:
    name: Archives, RPM, DEB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build snapshot with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          SOW_VERSION: 0.2.0

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rpm

      - name: Verify archives and Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f -name 'sow_*.tar.gz' | sort)
          mapfile -t rpms < <(find dist -maxdepth 1 -type f -name 'sow-*.rpm' | sort)
          mapfile -t debs < <(find dist -maxdepth 1 -type f -name 'sow_*.deb' | sort)
          test "${#archives[@]}" -eq 4
          test "${#rpms[@]}" -eq 2
          test "${#debs[@]}" -eq 2
          (cd dist && sha256sum --check SHA256SUMS)
          for package in "${rpms[@]}"; do
            rpm -qpl "${package}" | grep -Fx '/usr/bin/sow'
          done
          for package in "${debs[@]}"; do
            dpkg-deb --contents "${package}" | grep -E 'usr/bin/sow$'
          done
