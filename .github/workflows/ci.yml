name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Normal CI remains local and secret-free. Networked client and S3 tests live
# in integration.yml.
env:
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  quality:
    name: Format, Vet, Staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting and module files
        run: make fmt-check tidy-check

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Dead code reachability
        run: |
          deadcode_version="$(make --no-print-directory deadcode-version)"
          go install "golang.org/x/tools/cmd/deadcode@${deadcode_version}"
          PATH="$(go env GOPATH)/bin:${PATH}" make deadcode DEADCODE_VERSION="${deadcode_version}"

      - name: Compile performance contracts and verify fixtures
        run: make test-perf-contract

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  test:
    name: Unit and Core Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test Go packages
        run: go test -timeout 30m -count=1 ./...

      - name: Test patched RPM parser module
        run: (cd third_party/cavaliergopher-rpm && go test -count=1 ./...)

  race:
    name: Core Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Race-test core repository packages
        run: make race

  clean-delivery:
    name: Clean Source Delivery
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify clean source delivery
        run: make clean-delivery

  package:
    name: Archives, RPM, DEB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build snapshot with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          SOW_VERSION: 0.3.0

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes cpio rpm

      - name: Verify archives and Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f -name 'sow_*.tar.gz' | sort)
          mapfile -t rpms < <(find dist -maxdepth 1 -type f -name 'sow-*.rpm' | sort)
          mapfile -t debs < <(find dist -maxdepth 1 -type f -name 'sow_*.deb' | sort)
          test "${#archives[@]}" -eq 4
          test "${#rpms[@]}" -eq 2
          test "${#debs[@]}" -eq 2
          (cd dist && sha256sum --check SHA256SUMS)
          license_sha256="$(sha256sum LICENSE | awk '{print $1}')"
          for package in "${rpms[@]}"; do
            rpm -qpl "${package}" | grep -Fx '/usr/bin/sow'
            rpm -qpl "${package}" | grep -Fx '/usr/share/licenses/sow/LICENSE'
            rpm -qp --queryformat '%{LICENSE}\n' "${package}" | grep -Fx 'Apache-2.0'
            packaged_license_sha256="$(
              rpm2cpio "${package}" |
                cpio -i --quiet --to-stdout './usr/share/licenses/sow/LICENSE' |
                sha256sum |
                awk '{print $1}'
            )"
            test "${packaged_license_sha256}" = "${license_sha256}"
          done
          for package in "${debs[@]}"; do
            dpkg-deb --contents "${package}" | grep -E 'usr/bin/sow$'
            dpkg-deb --contents "${package}" | grep -E 'usr/share/doc/sow/copyright$'
            packaged_license_sha256="$(
              dpkg-deb --fsys-tarfile "${package}" |
                tar -xOf - './usr/share/doc/sow/copyright' |
                sha256sum |
                awk '{print $1}'
            )"
            test "${packaged_license_sha256}" = "${license_sha256}"
          done
